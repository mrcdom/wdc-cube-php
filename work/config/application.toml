# WeDoCode Shopping (PHP) - configuração da aplicação
# Caminho padrão: work/config/application.toml (relativo à raiz do projeto)
# Outro arquivo: SHOPPING_CONFIG_FILE=/caminho/application.toml
# Sobrescritas locais (fora do git): application.local.toml nesta mesma pasta.

[app]
# Pasta base de runtime (data, log, temp, frontend), relativa a ESTE arquivo.
basedir = ".."

[database]
# PostgreSQL. Usuário e senha ficam no application.local.toml (fora do git):
#   [database]
#   username = "postgres"
#   password = "..."
# Se o banco não existir, o servidor tenta criá-lo; o schema e o seed são criados na primeira subida.
url = "pgsql:host=localhost;port=5432;dbname=wedocode_shopping_php"
# conexões simultâneas com o banco (cada consulta em andamento ocupa uma)
pool.maxConnections = 16

[server]
port = 8080
devMode = true

[security]
jwt.secret = "wdc-shopping-jwt-s3cr3t-k3y-ch4ng3-1n-pr0duct10n"

[simulation]
# Simula login lento (3 s) no LoginPresenter
slowLogin = false
