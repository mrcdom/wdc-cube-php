# WeDoCode Store (PHP) - application configuration
# Default path: work/config/application.toml (relative to the project root)
# Another file: STORE_CONFIG_FILE=/path/application.toml
# Local overrides (not in git): application.local.toml in this same folder.

[app]
# Runtime base folder (data, log, temp, frontend), relative to THIS file.
basedir = ".."

[database]
# PostgreSQL. Username and password live in application.local.toml (not in git):
#   [database]
#   username = "postgres"
#   password = "..."
# If the database does not exist, the server tries to create it; the schema and seed are created on first start.
url = "pgsql:host=localhost;port=5432;dbname=wedocode_store_php"
# concurrent database connections (each in-flight query takes one)
pool.maxConnections = 16

[server]
port = 8080
devMode = true

[security]
jwt.secret = "wdc-store-jwt-s3cr3t-k3y-ch4ng3-1n-pr0duct10n"

[simulation]
# Simulates a slow login (3 s) in LoginPresenter
slowLogin = false
